<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Bank Demo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- LOGIN -->
  <div id="loginPage" class="page active">
    <h2>🏦 Premium Bank</h2>
    <input id="pin" type="password" placeholder="Enter PIN">
    <button onclick="login()">Login</button>
    <p class="small">Demo PIN: 1234</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashPage" class="page">

    <div class="card">
      <h3>Available Balance</h3>
      <h1 id="balance">$83,450 USD</h1>
    </div>

    <div class="card">
      <button onclick="openPage('transferPage')">💸 Transfer Money</button>
      <button onclick="openPage('historyPage')">📜 Transaction History</button>
    </div>

  </div>

  <!-- TRANSFER -->
  <div id="transferPage" class="page">

    <div class="card">
      <h2>Send Money</h2>

      <input id="name" placeholder="Receiver Name">
      <input id="amount" placeholder="Amount">

      <button onclick="sendMoney()">Send</button>

      <div class="bar">
        <div id="progress"></div>
      </div>

      <p id="status"></p>

      <button onclick="openPage('dashPage')">Back</button>
    </div>

  </div>

  <!-- HISTORY -->
  <div id="historyPage" class="page">

    <div class="card">
      <h2>History</h2>

      <div id="history"></div>

      <button onclick="openPage('dashPage')">Back</button>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
