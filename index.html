<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANZ BANK Transfer</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6fa;
margin:0;
}

.header{
background:#0055A5;
color:white;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.screen{
max-width:500px;
margin:20px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

.btn{
width:100%;
padding:15px;
border:none;
background:#0055A5;
color:white;
border-radius:10px;
margin-top:10px;
cursor:pointer;
font-size:16px;
}

.option{
border:1px solid #ddd;
padding:15px;
margin:10px 0;
border-radius:10px;
cursor:pointer;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
}

.hidden{
display:none;
}

.receipt{
background:#f8f8f8;
padding:15px;
border-radius:10px;
line-height:2;
}
</style>
</head>

<body>

<div class="header">
🏦 ANZ BANK
</div>

<!-- STEP 1 -->

<div class="screen" id="step1">
<h2>Transfer Money</h2>

<button class="btn" onclick="bankTransfer()">
Bank Transfer
</button>

<button class="btn" onclick="walletTransfer()">
Other Wallet
</button>
</div>

<!-- STEP 2 -->

<div class="screen hidden" id="step2">
<h2>Select Method</h2>

<div id="options"></div>

<button class="btn" onclick="nextDetails()">
Continue
</button>
</div>

<!-- STEP 3 -->

<div class="screen hidden" id="step3">

<h2>Sender Details</h2>

<input id="sname" placeholder="Sender Name">
<input id="sacc" placeholder="Account Number">

<h2>Receiver Details</h2>

<input id="rname" placeholder="Receiver Name">
<input id="racc" placeholder="Receiver Account / Wallet ID">

<input id="amount" placeholder="Amount">

<button class="btn" onclick="sendMoney()">
Send Money
</button>

</div>

<!-- STEP 4 -->

<div class="screen hidden" id="step4">

<h2>Processing Transfer...</h2>

<h1 id="timer">30</h1>

<p>Please wait...</p>

</div>

<!-- STEP 5 -->

<div class="screen hidden" id="step5">

<h2>Transfer Receipt</h2>

<div class="receipt" id="receipt"></div>

<button class="btn" onclick="window.print()">
Save Receipt
</button>

</div>

<script>

let selectedMethod="";

function bankTransfer(){

document.getElementById("step1").classList.add("hidden");
document.getElementById("step2").classList.remove("hidden");

document.getElementById("options").innerHTML=`
<div class="option" onclick="pick('ANZ Bank')">ANZ Bank</div>
<div class="option" onclick="pick('NAB Bank')">NAB Bank</div>
<div class="option" onclick="pick('Westpac')">Westpac</div>
`;

}

function walletTransfer(){

document.getElementById("step1").classList.add("hidden");
document.getElementById("step2").classList.remove("hidden");

document.getElementById("options").innerHTML=`
<div class="option" onclick="pick('JazzCash')">JazzCash</div>
<div class="option" onclick="pick('Easypaisa')">Easypaisa</div>
<div class="option" onclick="pick('Maya')">Maya</div>
<div class="option" onclick="pick('GCash')">GCash</div>
<div class="option" onclick="pick('Alipay')">Alipay</div>
<div class="option" onclick="pick('Western Union')">Western Union</div>
`;
}

function pick(name){
selectedMethod=name;
alert(name+" selected");
}

function nextDetails(){

if(selectedMethod==""){
alert("Select Method");
return;
}

document.getElementById("step2").classList.add("hidden");
document.getElementById("step3").classList.remove("hidden");

}

function sendMoney(){

document.getElementById("step3").classList.add("hidden");
document.getElementById("step4").classList.remove("hidden");

let count=30;

let x=setInterval(function(){

count--;

document.getElementById("timer").innerHTML=count;

if(count<=0){

clearInterval(x);

showReceipt();

}

},1000);

}

function showReceipt(){

document.getElementById("step4").classList.add("hidden");
document.getElementById("step5").classList.remove("hidden");

let txn="TXN"+Math.floor(Math.random()*99999999);

document.getElementById("receipt").innerHTML=`

<b>Status:</b> SUCCESS ✅<br>

<b>Transaction ID:</b> ${txn}<br>

<b>Method:</b> ${selectedMethod}<br>

<b>Sender:</b> ${sname.value}<br>

<b>Receiver:</b> ${rname.value}<br>

<b>Amount:</b> $${amount.value}<br>

<b>Date:</b> ${new Date().toLocaleString()}<br>

`;

}

</script>

</body>
  </html>
